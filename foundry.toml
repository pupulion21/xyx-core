[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["*"]
auto_detect_solc = true
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 32, fail_on_revert = false }

[profile.lite]
optimizer = true
optimizer_runs = 50
via_ir = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad_mainnet = "${MONAD_MAINNET_RPC_URL}"

[etherscan]
monad_testnet = { key = "${MONADSCAN_API_KEY}", url = "${MONAD_TESTNET_RPC_URL}", chainId = 10143 }
